name: Backend PostgreSQL checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      HT_TEST_MODE: github
      HT_TEST_DB_HOST: 127.0.0.1

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ht_test_runner
          POSTGRES_DB: hustlytasker_test_control
          # This fresh, job-scoped service contains test data only.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U ht_test_runner -d hustlytasker_test_control"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install pinned backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Check test-harness safety guards
        run: python -m unittest discover -s scripts -p test_test_backend.py

      - name: Run backend checks and full PostgreSQL suite
        env:
          HT_TEST_DB_PORT: ${{ job.services.postgres.ports['5432'] }}
        run: python scripts/test_backend.py
