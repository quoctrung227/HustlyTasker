# =============================================================================
# deploy.yml — GitHub Actions: test -> build image -> push GHCR -> SSH deploy VPS
# Đặt tại .github/workflows/deploy.yml của repo Spring Boot.
# (Repo Next.js hiện tại KHÔNG có workflow nào — không có .github/workflows,
#  Vercel tự build khi push; workflow này là CI/CD ĐẦU TIÊN của hệ thống.)
#
# Secrets cần khai trong repo Settings > Secrets and variables > Actions:
#   SSH_KEY     — private key (ed25519) của user `deploy` trên VPS
#   VPS_HOST    — IP hoặc hostname VPS
#   VPS_USER    — deploy
#   GHCR_USER   — GitHub username dùng để pull image trên VPS
#   GHCR_TOKEN  — Personal Access Token (classic) scope read:packages,
#                 dùng docker login TRÊN VPS (GITHUB_TOKEN của workflow
#                 không dùng được ngoài runner)
# Push image từ runner dùng GITHUB_TOKEN sẵn có (permissions: packages: write).
# =============================================================================

name: Deploy API to VPS

on:
  push:
    branches: [main]
  # Cho phép deploy tay lại commit hiện tại (vd sau khi VPS restore)
  workflow_dispatch:

# Chống deploy chồng: mọi run cùng group xếp hàng tuần tự.
# cancel-in-progress: false — KHÔNG kill run đang deploy dở (kill giữa chừng
# `docker compose up` có thể để VPS ở trạng thái nửa vời); run mới chờ.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  # github.repository_owner = phucmetlamroi -> ghcr.io/phucmetlamroi/hustlytasker-api
  # PHẢI khớp image trong docker-compose.yml trên VPS.
  IMAGE: ghcr.io/${{ github.repository_owner }}/hustlytasker-api

jobs:
  # ---------------------------------------------------------------------------
  # 1. TEST — gate bắt buộc trước khi build image
  # ---------------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven          # cache ~/.m2 theo hash pom.xml

      # verify = test + integration-test. Integration test đụng DB nên dùng
      # Testcontainers (Postgres 16 — cùng version với compose trên VPS)
      # thay vì H2: Task.status là String tự do + nhiều partial unique index
      # lower(name) chỉ tồn tại trên Postgres thật (prisma/migrations/manual/).
      - name: Run tests
        run: mvn -B verify

  # ---------------------------------------------------------------------------
  # 2. BUILD + PUSH GHCR
  # ---------------------------------------------------------------------------
  build-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write           # cho phép GITHUB_TOKEN push lên ghcr.io
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .            # monorepo backend/ thì đổi thành ./backend
          file: ./Dockerfile
          push: true
          # :latest cho compose pull mặc định; :sha-<commit> để rollback chính xác
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # 3. DEPLOY — SSH vào VPS, pull image mới, restart CHỈ service api
  # ---------------------------------------------------------------------------
  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    environment: production     # có thể gắn required reviewers trên GitHub nếu muốn gate tay
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_KEY }}
          script_stop: true     # lệnh nào fail là dừng ngay, job đỏ
          script: |
            # Login GHCR bằng PAT read:packages (image private)
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USER }}" --password-stdin

            cd /opt/hustlytasker

            # Pull + swap CHỈ api — không đụng db/caddy (--no-deps),
            # tránh restart Postgres/Caddy mỗi lần deploy code.
            docker compose pull api
            docker compose up -d --no-deps api

            # Chờ healthcheck xanh rồi mới kết luận deploy thành công
            # (healthcheck định nghĩa trong docker-compose.yml, interval 30s)
            for i in $(seq 1 12); do
              status=$(docker inspect --format='{{.State.Health.Status}}' $(docker compose ps -q api))
              [ "$status" = "healthy" ] && echo "API healthy" && break
              [ "$i" = "12" ] && echo "API not healthy after 6 minutes" && exit 1
              sleep 30
            done

            # Dọn image cũ (giữ image đang chạy)
            docker image prune -f
